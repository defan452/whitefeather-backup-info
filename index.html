<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whitefeather ECS Backup</title><style>body{max-width:740px;margin:4rem auto;padding:0 1.2rem;font:18px/1.8 system-ui;color:#183044;background:#f8fcff}a{color:#245e9c}.draft{background:#fff3cf;padding:1rem}</style><main><h1>Whitefeather ECS Backup</h1><p>这是供操作者本人使用的个人加密备份工具，用于保存和恢复白羽的长期状态。当前仍在建设与验收，尚未正式启用长期云端备份服务。</p><p>Google Drive 连接只请求 <code>drive.file</code> 权限，用于本应用创建或由操作者明确选择交给本应用的文件。它不会请求读取整个云盘、邮箱或其他 Google 服务。</p><p>备份内容先在受控机器加密，再传入 Google Drive。恢复密钥不随备份上传。另有最小化控制文件，帮助恢复时识别后续删除、撤权及旧版本。</p><p><a href="privacy.html">隐私说明</a> · <a href="terms.html">使用说明</a></p></main></html>
